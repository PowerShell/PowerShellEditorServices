name: Emacs End-to-End Tests

on:
  push:
    branches: [ main ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read

jobs:
  emacs:
    name: ert
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_GENERATE_ASPNET_CERTIFICATE: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install PSResources
        shell: pwsh
        run: tools/installPSResources.ps1

      - name: Build
        shell: pwsh
        run: Invoke-Build Build

      - name: Install Emacs
        uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: '28.2'

      - name: Run ERT with full CLI
        run: |
          emacs -Q --batch -f package-refresh-contents --eval "(package-install 'eglot)"
          emacs -Q --batch -l test/emacs-test.el -f ert-run-tests-batch-and-exit

      - name: Run ERT with simple CLI
        run: |
          emacs -Q --batch -f package-refresh-contents --eval "(package-install 'eglot)"
          emacs -Q --batch -l test/emacs-simple-test.el -f ert-run-tests-batch-and-exit
